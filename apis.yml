name: Smart Reno
description: >-
  Smart Reno is a Montreal-based home-renovation marketplace, founded in 2012 by Andrei Uglar,
  that connects homeowners with qualified, available local contractors. Homeowners post a project
  and receive up to three competing quotes from vetted renovation professionals through a proprietary
  contractor-matching platform. Backed by 500 Startups (500 Global), Anges Quebec, and BDC, Smart Reno
  was acquired by RBC Ventures in 2019 and now operates its consumer marketplace under the
  soumissionrenovation.ca brand across Quebec, Ontario, and Alberta. The company exposes no public
  developer API, SDK, documentation portal, or webhook surface; smartreno.com 301-redirects to the
  successor site and no /.well-known discovery documents were found.
